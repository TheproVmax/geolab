
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLab</title>

<style>
:root {
  --bg:#faf9f6;
  --ink:#292d2a;
  --muted:#777a74;
  --line:#e5e3dc;
  --green:#dce9d7;
  --blue:#dce8f0;
  --yellow:#f4edcf;
  --coral:#f2dfd8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;line-height:1.5
}
button,select,input{font:inherit}
button{cursor:pointer}
nav{
  padding:14px 5%;display:flex;justify-content:space-between;
  align-items:center;gap:18px;border-bottom:1px solid var(--line);
  background:#fff
}
.logo{font-size:21px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.7px}
.logo span{color:#65845e}
.nav-links{display:flex;gap:17px;flex-wrap:wrap}
.nav-links a{font-size:13px;text-decoration:none;color:var(--ink)}
.nav-links a:hover{text-decoration:underline}
main{max-width:1080px;margin:auto;padding:0 24px}
.hero{
  padding:48px 0 38px;display:grid;grid-template-columns:1fr .8fr;
  align-items:center;gap:28px
}
.kicker{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--muted)}
h1{font-size:clamp(38px,5.5vw,61px);line-height:1.06;letter-spacing:-2.5px;margin:9px 0 14px}
h1 em{font-style:normal;color:#65845e}
.hero p{color:var(--muted);margin:0 0 19px;font-size:15px}
.primary,.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 13px;border-radius:6px;border:1px solid #c9c9c1;
  background:#fff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600
}
.primary{background:#65845e;border-color:#65845e;color:#fff}
.primary:hover,.btn:hover{opacity:.85}
.hero-art{
  min-height:215px;background:#edf1ed;border:1px solid var(--line);
  border-radius:10px;display:grid;place-items:center;overflow:hidden;position:relative
}
.hero-art svg{width:88%;max-width:350px}
.hero-note{
  position:absolute;bottom:9px;right:10px;background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:11px
}
.section{padding:32px 0;border-top:1px solid var(--line);scroll-margin-top:18px}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:17px}
h2{font-size:clamp(26px,3.5vw,35px);letter-spacing:-1px;line-height:1.2;margin:3px 0 0}
h3{margin:0 0 10px;font-size:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px}
.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(230px,.8fr);gap:12px}
.viewer-panel{padding:10px;min-width:0}
.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 4px 10px}
.viewer-top strong{font-size:14px}
.viewer-buttons{display:flex;gap:5px;flex-wrap:wrap}
.viewer-buttons button{font-size:11px;padding:6px 8px}
#viewer{
  height:360px;min-height:280px;position:relative;overflow:hidden;
  border-radius:7px;background:#e9edf0;touch-action:pan-y
}
#viewer canvas{display:block;width:100%;height:100%;outline:none}
.viewer-help{
  position:absolute;bottom:8px;left:8px;padding:5px 7px;
  background:#ffffffdf;border:1px solid #d8d8d0;border-radius:5px;
  font-size:10px;pointer-events:none
}
.viewer-error{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  text-align:center;padding:22px;background:#e9edf0
}
.viewer-error.show{display:flex}
.viewer-error div{max-width:320px}
.viewer-error p{font-size:13px;color:var(--muted)}
.controls{display:flex;flex-direction:column;gap:15px}
.control label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;margin-bottom:6px}
.control output{color:#65845e}
input[type=range]{width:100%;accent-color:#65845e;cursor:pointer}
select{width:100%;padding:9px;border:1px solid #d9d8d0;border-radius:6px;background:#fff;color:var(--ink)}
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.measure{padding:10px;border-radius:6px;background:#edf2e9;min-width:0}
.measure:nth-child(2){background:#f5f0dd}
.measure-wide{grid-column:1/-1;background:#edf1f4}
.measure small{font-size:11px;display:block;color:var(--muted)}
.measure strong{display:block;font-size:19px;overflow-wrap:anywhere}
.shape-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.shape-card{text-align:left;padding:10px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px}
.shape-card:hover{border-color:#9da99a}
.shape-card.active{border:2px solid #65845e;padding:9px}
.shape-art{height:85px;border-radius:5px;display:grid;place-items:center;margin-bottom:9px}
.shape-art svg{width:95px;height:80px}
.shape-card strong{display:block;font-size:13px}
.shape-card small{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.filter{border:1px solid #d9d8d0;background:#fff;color:var(--ink);padding:7px 11px;border-radius:5px;font-size:12px}
.filter.active{background:#65845e;color:#fff;border-color:#65845e}
.formula-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formula-card{padding:14px;background:#fff;border:1px solid var(--line);border-radius:8px}
.formula-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.formula-card h3{font-size:13px;margin:0}
.grade-tag{background:#edf2e9;border-radius:4px;padding:3px 6px;font-size:10px;white-space:nowrap}
.formula{font-family:Georgia,"Times New Roman",serif;font-size:22px;overflow-wrap:anywhere;padding:10px 0 4px}
.formula-card p{font-size:12px;color:var(--muted);margin:0}
.practice-layout{display:grid;grid-template-columns:minmax(0,1fr) 135px;gap:11px}
.question-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:20px}
.question-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}
.question-number{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.question-text{font-size:21px;font-weight:700;margin:0 0 17px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answer{text-align:left;padding:11px;border:1px solid var(--line);border-radius:6px;background:#faf9f6;color:var(--ink)}
.answer:hover:not(:disabled){border-color:#9da99a}
.answer:disabled{cursor:default}
.answer.correct{background:#dce9d7;border-color:#8fa889}
.answer.wrong{background:#f2dfd8;border-color:#c89c8d}
.feedback{min-height:22px;margin:12px 0 8px;font-size:13px;font-weight:600}
.practice-actions{display:flex;flex-wrap:wrap;gap:7px}
.score-card{
  background:#f5f0dd;border:1px solid var(--line);border-radius:9px;padding:15px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start
}
.score-card strong{font-size:35px;letter-spacing:-1.5px}
.score-card .btn{padding:7px 9px}
footer{margin-top:20px;border-top:1px solid var(--line);padding:21px 24px;background:#fff}
.footer-inner{max-width:1080px;margin:auto;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}
@media(max-width:800px){
  .hero{grid-template-columns:1fr;padding-top:42px}
  .hero-art{min-height:200px}
  .lab-grid{grid-template-columns:1fr}
  .shape-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .viewer-top{align-items:flex-start;flex-direction:column}
  .score-card{flex-direction:row;align-items:center;min-height:75px}
}
@media(max-width:500px){
  nav{padding:14px 16px;align-items:flex-start;flex-direction:column}
  .nav-links{gap:10px 14px}
  main{padding:0 15px}
  h1{letter-spacing:-1.8px}
  #viewer{height:310px}
  .formula-grid,.practice-layout{grid-template-columns:1fr}
  .question-card{padding:15px}
  .question-text{font-size:19px}
  .answers{grid-template-columns:1fr}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<nav>
  <a class="logo" href="#">Geo<span>Lab</span>.</a>
  <div class="nav-links">
    <a href="#lab">3D Lab</a>
    <a href="#shapes">Shapes</a>
    <a href="#formulas">Formulas</a>
    <a href="#practice">Practice</a>
  </div>
</nav>

<main>
<header class="hero">
  <div>
    <div class="kicker">Geometry playground</div>
    <h1>Math you can <em>move.</em></h1>
    <p>Spin it. Zoom in. Figure it out.</p>
    <a class="primary" href="#lab">Try the 3D lab ↓</a>

    <svg viewBox="0 0 340 230" aria-label="Geometric shapes">
      <g stroke="#292d2a" stroke-width="2.4" stroke-linejoin="round">
        <path d="M65 72 L125 40 L185 72 L125 106 Z" fill="#fff"/>
        <path d="M65 72 L65 140 L125 174 L125 106 Z" fill="#dce9d7"/>
        <path d="M125 106 L185 72 L185 140 L125 174 Z" fill="#8daf9e"/>
        <circle cx="247" cy="72" r="31" fill="#f2dfd8"/>
        <path d="M220 145 L274 145 L297 192 L197 192 Z" fill="#f4edcf"/>
      </g>

    <div class="hero-note">Drag to rotate</div>
