
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLab</title>
<style>
:root {
  --paper: #f8f6ef;
  --ink: #252b27;
  --green: #c9dfbd;
  --blue: #cbdff0;
  --coral: #f1c4b5;
  --yellow: #f2df9d;
  --line: #d9d8cf;
  --muted: #73766e;
  --white: #fffef9;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Trebuchet MS", Arial, sans-serif;
  line-height: 1.5;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 6%;
  border-bottom: 1px solid var(--line);
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span { color: #65875c; }

.nav-links {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
}

.nav-links a {
  color: var(--ink);
  text-decoration: none;
  font-size: 13px;
}

.nav-links a:hover { text-decoration: underline; }

main {
  max-width: 1120px;
  margin: auto;
  padding: 0 24px;
}

.hero {
  padding: 75px 0 55px;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  align-items: center;
  gap: 35px;
}

.hero h1 {
  font-size: clamp(43px, 7vw, 76px);
  letter-spacing: -4px;
  line-height: 1.02;
  margin: 0 0 18px;
  max-width: 620px;
}

.hero h1 em {
  font-style: normal;
  background: var(--yellow);
  padding: 0 8px;
  border-radius: 7px;
}

.hero p {
  font-size: 16px;
  color: var(--muted);
  margin: 0 0 24px;
}

.primary-button, .button {
  display: inline-block;
  padding: 11px 17px;
  border: 1px solid var(--ink);
  border-radius: 8px;
  background: var(--ink);
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
}

.button {
  background: var(--white);
  color: var(--ink);
}

.primary-button:hover, .button:hover {
  transform: translateY(-1px);
}

.hero-art {
  min-height: 280px;
  background: var(--blue);
  border: 1px solid var(--ink);
  border-radius: 18px;
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}

.hero-art svg {
  width: 90%;
  max-width: 390px;
}

.art-note {
  position: absolute;
  right: 15px;
  bottom: 12px;
  background: var(--white);
  border: 1px solid var(--ink);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  transform: rotate(-3deg);
}

.section {
  padding: 45px 0;
  border-top: 1px solid var(--line);
  scroll-margin-top: 20px;
}

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 24px;
}

.kicker {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

h2 {
  font-size: clamp(28px, 4vw, 42px);
  letter-spacing: -1.7px;
  margin: 3px 0 0;
  line-height: 1.15;
}

h3 {
  font-size: 18px;
  margin: 0 0 12px;
}

.panel {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
}

.builder-grid {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 16px;
}

.canvas-panel {
  min-height: 360px;
  display: flex;
  flex-direction: column;
}

.canvas-wrap {
  flex: 1;
  min-height: 250px;
  background-color: #f1f0e8;
  background-image:
    linear-gradient(#dcdcd2 1px, transparent 1px),
    linear-gradient(90deg, #dcdcd2 1px, transparent 1px);
  background-size: 24px 24px;
  border-radius: 9px;
  overflow: hidden;
  display: grid;
  place-items: center;
}

#shapeCanvas {
  width: 100%;
  height: 100%;
  min-height: 250px;
  display: block;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.control-group label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}

input[type="range"] {
  width: 100%;
  accent-color: #65875c;
}

select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 7px;
  color: var(--ink);
}

.stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}

.stat {
  border-radius: 9px;
  padding: 13px;
  background: var(--green);
}

.stat:nth-child(2) { background: var(--yellow); }

.stat small {
  display: block;
  font-size: 11px;
  opacity: .75;
}

.stat strong {
  display: block;
  font-size: 22px;
  margin-top: 3px;
}

.shape-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.shape-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  background: var(--white);
  text-align: left;
  color: var(--ink);
  transition: transform .15s, border-color .15s;
}

.shape-card:hover {
  transform: translateY(-3px);
  border-color: var(--ink);
}

.shape-card.selected {
  border: 2px solid var(--ink);
  padding: 15px;
}

.shape-art {
  height: 100px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  margin-bottom: 13px;
}

.shape-art svg {
  width: 100px;
  height: 85px;
}

.shape-card strong {
  display: block;
  font-size: 16px;
}

.shape-card small {
  color: var(--muted);
  font-size: 12px;
}

.formula-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.filter-button {
  padding: 8px 13px;
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 30px;
  font-size: 12px;
}

.filter-button.active {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}

.formula-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.formula-card {
  padding: 17px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 11px;
}

.formula-card .formula-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

.formula-card h3 {
  font-size: 15px;
  margin: 0;
}

.grade-tag {
  font-size: 10px;
  background: var(--green);
  padding: 4px 7px;
  border-radius: 5px;
  white-space: nowrap;
}

.formula {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 25px;
  overflow-wrap: anywhere;
  padding: 8px 0;
}

.formula-card p {
  color: var(--muted);
  font-size: 12px;
  margin: 4px 0 0;
}

.practice-layout {
  display: grid;
  grid-template-columns: 1fr 180px;
  gap: 14px;
  align-items: stretch;
}

.question-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 25px;
}

.question-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 25px;
}

.question-number {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 800;
}

.question-text {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.5px;
  margin: 0 0 20px;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.answer-button {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 13px;
  border-radius: 8px
